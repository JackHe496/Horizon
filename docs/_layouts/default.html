<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#12221c">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self'">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◉</text></svg>">
    <link rel="alternate" type="application/rss+xml" title="Horizon Daily RSS" href="{{ '/feed.xml' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="Horizon 中文日报" href="{{ '/feed-zh.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/horizon.css' | relative_url }}">
    <script src="{{ '/assets/js/horizon.js' | relative_url }}" defer></script>
    {% if page.radar %}
      <script src="{{ '/assets/js/tools-radar-core.js' | relative_url }}" defer></script>
      <script src="{{ '/assets/js/tools-radar.js' | relative_url }}" defer></script>
    {% endif %}
  </head>
  <body class="{% if page.radar %}radar-page{% endif %}">
    <a class="skip-link" href="#main-content">跳到正文</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Horizon AI 工具雷达首页">
          <span class="brand__mark" aria-hidden="true"><span></span></span>
          <span class="brand__text">
            <strong>HORIZON</strong>
            <small>JACK'S AI TOOL RADAR</small>
          </span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/tool-stream/' | relative_url }}"{% if page.url == '/tool-stream/' %} aria-current="page"{% endif %}>每日流</a>
          <a href="{{ '/tools/' | relative_url }}"{% if page.url == '/tools/' %} aria-current="page"{% endif %}>工具目录</a>
          <a href="{{ '/weekly/' | relative_url }}"{% if page.url == '/weekly/' %} aria-current="page"{% endif %}>每周精选</a>
          <a href="{{ '/favorites/' | relative_url }}"{% if page.url == '/favorites/' %} aria-current="page"{% endif %}>本地收藏</a>
          <a href="{{ '/daily/' | relative_url }}"{% if page.url == '/daily/' %} aria-current="page"{% endif %}>原日报</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="site-main main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div>
        <strong>Horizon AI Tool Radar</strong>
        <p>中文优先 · 免费优先 · 证据可追溯 · 无登录、无遥测</p>
      </div>
      <p>安装命令只展示和复制，从不自动执行。任何 Skill、Plugin 或 MCP 安装都需要你的明确确认。</p>
    </footer>
  </body>
</html>
