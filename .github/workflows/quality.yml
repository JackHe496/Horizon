name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Python tests
        run: uv run pytest

      - name: Run page interaction tests
        run: node --test tests/js/tools-radar.test.js

      - name: Rebuild tools data without network
        run: uv run python scripts/build_tools_radar.py --offline --mode all

  jekyll:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Jekyll 3.9 and the lockfile match the legacy GitHub Pages toolchain.
          ruby-version: "2.7"
          bundler-cache: true

      - name: Build static site
        run: bundle exec jekyll build --source docs --destination _site
