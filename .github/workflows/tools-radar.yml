name: AI Tools Radar

on:
  schedule:
    # 08:30 Asia/Shanghai: refresh the daily discovery stream.
    - cron: '30 0 * * *'
    # 09:00 Asia/Shanghai every Monday: refresh verified weekly picks.
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Data set to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - daily
          - weekly

concurrency:
  group: horizon-pages
  cancel-in-progress: false

jobs:
  build-tools-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Resolve refresh mode
        run: |
          mode="daily"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "0 1 * * 1" ]]; then
            mode="weekly"
          fi
          echo "RADAR_MODE=$mode" >> "$GITHUB_ENV"

      - name: Test tools data pipeline
        run: |
          uv run pytest -q tests/tools_radar
          node --test tests/js/tools-radar.test.js

      - name: Generate tools catalog and selected feed
        run: |
          uv run python scripts/build_tools_radar.py \
            --mode "$RADAR_MODE" \
            --ai

      - name: Deploy tools radar to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "🧭 AI Tools Radar (${{ env.RADAR_MODE }})"
